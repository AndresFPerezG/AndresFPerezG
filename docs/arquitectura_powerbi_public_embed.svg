<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura Drupal y Power BI para portal publico</title>
  <desc id="desc">Diagrama limpio de arquitectura para embed publico de Power BI con broker de token en Drupal.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; ry: 14; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
      .box-soft { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 10; ry: 10; }
      .box-sec { fill: #f0fdf4; stroke: #166534; stroke-width: 2; rx: 10; ry: 10; }
      .box-ext { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 10; ry: 10; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #334155; }
      .zone-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .label { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #1e293b; }
      .flow { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
      .flow-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .security { font-family: Arial, sans-serif; font-size: 14px; fill: #166534; font-weight: 700; }
      .arrow { stroke: #0f172a; stroke-width: 2.4; fill: none; marker-end: url(#arrowHead); }
      .arrow-dashed { stroke: #475569; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowHead); }
      .step-circle { fill: #0f172a; }
      .step-number { font-family: Arial, sans-serif; font-size: 12px; fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1220" class="bg"/>

  <text x="50" y="56" class="title">Arquitectura recomendada: Drupal + Power BI (portal publico)</text>
  <text x="50" y="86" class="subtitle">Diseno actualizado con separacion visual y flujo numerado para evitar montajes entre textos y flechas.</text>

  <rect x="40" y="125" width="1620" height="270" class="zone"/>
  <text x="60" y="160" class="zone-title">Capa publica (internet)</text>

  <rect x="80" y="200" width="220" height="150" class="box"/>
  <text x="100" y="238" class="label">Visitante anonimo</text>
  <text x="100" y="262" class="small">Navegador web</text>
  <text x="100" y="286" class="small">Sin inicio de sesion</text>

  <rect x="340" y="200" width="280" height="150" class="box-sec"/>
  <text x="360" y="238" class="label">WAF / CDN / Proxy</text>
  <text x="360" y="262" class="small">Proteccion de borde</text>
  <text x="360" y="286" class="small">Rate limit global</text>
  <text x="360" y="310" class="small">Filtro anti abuso</text>

  <rect x="670" y="200" width="370" height="150" class="box-soft"/>
  <text x="690" y="238" class="label">Drupal frontend</text>
  <text x="690" y="262" class="small">Bloque PowerBiPublicEmbedBlock</text>
  <text x="690" y="286" class="small">JS powerbi-public-embed.js</text>
  <text x="690" y="310" class="small">Pide /api/powerbi/embed-config/{slug}</text>

  <rect x="1110" y="200" width="390" height="150" class="box-ext"/>
  <text x="1130" y="238" class="label">Power BI render service</text>
  <text x="1130" y="262" class="small">app.powerbi.com/reportEmbed</text>
  <text x="1130" y="286" class="small">Muestra el reporte al visitante</text>

  <rect x="40" y="430" width="1620" height="530" class="zone"/>
  <text x="60" y="465" class="zone-title">Backend y servicios confiables</text>

  <rect x="80" y="510" width="520" height="220" class="box-soft"/>
  <text x="100" y="548" class="label">Drupal backend (modulo powerbi_public_embed)</text>
  <text x="100" y="572" class="small">Endpoint: /api/powerbi/embed-config/{slug}</text>
  <text x="100" y="596" class="small">Valida slug en lista permitida (allowlist)</text>
  <text x="100" y="620" class="small">Solicita tokens temporales</text>
  <text x="100" y="644" class="small">Devuelve solo lo necesario para el embed</text>
  <text x="100" y="668" class="security">Nunca expone credenciales en el navegador</text>

  <rect x="80" y="760" width="520" height="170" class="box-sec"/>
  <text x="100" y="798" class="label">Controles de seguridad</text>
  <text x="100" y="822" class="small">Rate limit por IP y slug (Flood API)</text>
  <text x="100" y="846" class="small">Cache con TTL corto para tokens</text>
  <text x="100" y="870" class="small">mock_mode para pruebas de demo</text>
  <text x="100" y="894" class="small">Headers no-store en respuestas con token</text>

  <rect x="680" y="540" width="360" height="170" class="box-ext"/>
  <text x="700" y="578" class="label">Microsoft Entra ID</text>
  <text x="700" y="602" class="small">OAuth2 Client Credentials</text>
  <text x="700" y="626" class="small">Entrega access token al backend</text>

  <rect x="1110" y="540" width="390" height="170" class="box-ext"/>
  <text x="1130" y="578" class="label">Power BI REST API</text>
  <text x="1130" y="602" class="small">GenerateToken (View)</text>
  <text x="1130" y="626" class="small">Token de embed con expiracion corta</text>

  <rect x="680" y="760" width="820" height="170" class="box"/>
  <text x="700" y="798" class="label">Respuesta al frontend</text>
  <text x="700" y="822" class="small">JSON: reportId, groupId, embedUrl, accessToken, expiration, settings</text>
  <text x="700" y="846" class="small">El navegador recibe configuracion temporal y renderiza el reporte</text>
  <text x="700" y="870" class="security">Se evita el modelo inseguro de URL publica permanente</text>

  <path d="M300 275 L340 275" class="arrow"/>
  <circle cx="320" cy="252" r="13" class="step-circle"/>
  <text x="320" y="252" class="step-number">1</text>

  <path d="M620 275 L670 275" class="arrow"/>
  <circle cx="645" cy="252" r="13" class="step-circle"/>
  <text x="645" y="252" class="step-number">2</text>

  <path d="M1040 275 L1110 275" class="arrow-dashed"/>
  <circle cx="1075" cy="252" r="13" class="step-circle"/>
  <text x="1075" y="252" class="step-number">3</text>

  <path d="M855 350 L855 510" class="arrow"/>
  <circle cx="878" cy="430" r="13" class="step-circle"/>
  <text x="878" y="430" class="step-number">4</text>

  <path d="M600 600 L680 600" class="arrow"/>
  <circle cx="640" cy="577" r="13" class="step-circle"/>
  <text x="640" y="577" class="step-number">5</text>

  <path d="M600 655 L1110 655" class="arrow"/>
  <circle cx="855" cy="632" r="13" class="step-circle"/>
  <text x="855" y="632" class="step-number">6</text>

  <path d="M1305 710 L1305 760" class="arrow"/>
  <circle cx="1328" cy="735" r="13" class="step-circle"/>
  <text x="1328" y="735" class="step-number">7</text>

  <path d="M900 760 L900 350" class="arrow"/>
  <circle cx="923" cy="555" r="13" class="step-circle"/>
  <text x="923" y="555" class="step-number">8</text>

  <rect x="40" y="990" width="1620" height="190" class="zone"/>
  <text x="60" y="1025" class="flow-title">Flujo numerado (lectura rapida)</text>
  <text x="60" y="1055" class="flow">1) El visitante entra al portal publico.</text>
  <text x="60" y="1080" class="flow">2) El trafico pasa por WAF/CDN y llega al frontend Drupal.</text>
  <text x="60" y="1105" class="flow">3) El reporte se renderiza en el cliente solo con configuracion temporal.</text>
  <text x="820" y="1055" class="flow">4) El frontend pide embed-config al backend Drupal.</text>
  <text x="820" y="1080" class="flow">5) Drupal solicita access token a Entra ID.</text>
  <text x="820" y="1105" class="flow">6) Drupal solicita embed token a Power BI API.</text>
  <text x="820" y="1130" class="flow">7) Power BI responde token temporal al backend.</text>
  <text x="820" y="1155" class="flow">8) Drupal devuelve JSON seguro al frontend para mostrar el reporte.</text>
</svg>
